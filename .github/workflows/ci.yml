name: TubeShelf CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Export lockfile for initial dependency pinning
        run: |
          node -e 'const fs=require("fs");const content=fs.readFileSync("package-lock.json","utf8");for(let i=0;i<content.length;i+=1500){console.log("LOCKCHUNK:"+i+":"+JSON.stringify(content.slice(i,i+1500)))}'
      - name: Typecheck, tests and build
        run: npm run verify
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: tubeshelf-chrome-unpacked
          path: dist/
          if-no-files-found: error
