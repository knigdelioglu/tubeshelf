name: TubeShelf CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck, tests and build
        run: npm run verify
      - name: Browser acceptance test (real Chromium extension)
        run: npm run test:browser
        timeout-minutes: 4
      - name: Upload UAT screenshot if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tubeshelf-browser-uat-failure
          path: artifacts/browser-uat-failure.png
          if-no-files-found: ignore
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: tubeshelf-chrome-unpacked
          path: dist/
          if-no-files-found: error
